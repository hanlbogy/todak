<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토닥 · 메트로놈과 연습 기록</title>
<style>
:root{--bg:#F4F5FA;--card:#FFFFFF;--ink:#1D2233;--sub:#5A6078;--line:#DDE0EC;--accent:#4B5BD7;--on-accent:#FFFFFF;--soft:#E8EAFA;--gold:#E8A33D;--gold-soft:#FBF0DA;--danger:#B3363F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141C;--card:#1B1F2B;--ink:#ECEEF7;--sub:#A3A9C0;--line:#2D3242;--accent:#98A5FF;--on-accent:#12141C;--soft:#262B42;--gold:#F0B65A;--gold-soft:#332A19;--danger:#FF8A92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141C;--card:#1B1F2B;--ink:#ECEEF7;--sub:#A3A9C0;--line:#2D3242;--accent:#98A5FF;--on-accent:#12141C;--soft:#262B42;--gold:#F0B65A;--gold-soft:#332A19;--danger:#FF8A92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
.date{color:var(--sub);font-size:.95rem}
.grid{display:grid;gap:20px}
@media (min-width:900px){.wrap{max-width:1040px}.grid{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px}
.timer{text-align:center;color:var(--sub);font-size:1.05rem}
.timer b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:1.4rem;margin-left:6px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 10px;min-height:34px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:transparent;transition:background .06s,transform .06s,border-color .06s}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.dot.on.first{background:var(--gold);border-color:var(--gold)}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.step{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:2rem;line-height:1}
.step:active{background:var(--soft)}
.bpmbox{text-align:center}
#bpm{width:150px;border:0;background:transparent;text-align:center;font-size:4.6rem;font-weight:700;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
#bpm::-webkit-outer-spin-button,#bpm::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{color:var(--sub);font-size:.95rem;margin-top:-4px}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:6px 0 14px}
.beats{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.beats span{color:var(--sub);margin-right:6px}
.chip{min-width:56px;height:48px;padding:0 14px;border-radius:24px;border:2px solid var(--line);background:var(--card)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.go{width:100%;height:76px;border-radius:38px;border:0;background:var(--accent);color:var(--on-accent);font-size:1.5rem;font-weight:700}
.go.run{background:var(--ink);color:var(--bg)}
.finish{width:100%;height:56px;margin-top:12px;border-radius:28px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
.finish:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--sub)}
h2{font-size:1.2rem;margin:0 0 4px}
.hint{color:var(--sub);font-size:.95rem;margin:0 0 16px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item .nm{flex:1;min-width:0;word-break:break-word}
.item .meta{color:var(--sub);font-size:.92rem}
.item .tm{font-weight:700;font-variant-numeric:tabular-nums}
.x{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--sub);font-size:1.3rem}
.empty{color:var(--sub);padding:18px 0 4px}
.secondary{width:100%;height:56px;margin-top:16px;border-radius:28px;border:0;background:var(--soft);font-weight:700}
.note{margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--soft);color:var(--sub);font-size:.92rem}
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.overlay[hidden],[hidden]{display:none!important}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:28px 24px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px}}
.field{width:100%;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);padding:0 16px;margin:14px 0}
.row2{display:flex;gap:10px}
.row2 button{flex:1;height:56px;border-radius:28px;border:0;font-weight:700}
.btn-p{background:var(--accent);color:var(--on-accent)}.btn-s{background:var(--soft)}
.sum{text-align:center}
.badge{width:84px;height:84px;margin:4px auto 14px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.big{font-size:3.4rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.stat{background:var(--bg);border-radius:18px;padding:16px 8px}
.stat b{display:block;font-size:1.5rem}.stat span{color:var(--sub);font-size:.92rem}
.cheer{font-size:1.1rem;margin:6px 0 22px}
.sum .list{text-align:left;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:24px;z-index:30;font-size:.95rem;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="main">
  <header><h1>토닥</h1><span class="date" id="date"></span></header>
  <div class="grid">
    <section class="card" aria-label="메트로놈">
      <div class="timer">연습 시간 <b id="timer" aria-live="off">00:00</b></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="bpmrow">
        <button class="step" id="dec" aria-label="BPM 1 내리기">−</button>
        <div class="bpmbox"><input id="bpm" type="number" inputmode="numeric" min="30" max="240" value="80" aria-label="BPM 직접 입력"><div class="unit">BPM · 1분에 박 수</div></div>
        <button class="step" id="inc" aria-label="BPM 1 올리기">+</button>
      </div>
      <input type="range" id="range" min="30" max="240" value="80" aria-label="BPM 조절 막대">
      <div class="beats" id="beats" role="group" aria-label="박자 수"><span>박자</span></div>
      <button class="go" id="go">시작</button>
      <button class="finish" id="finish" disabled>연습 마치기</button>
    </section>

    <section class="card" aria-label="오늘의 연습">
      <h2>오늘의 연습</h2>
      <p class="hint">연습을 마칠 때마다 여기에 하나씩 쌓여요.</p>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">아직 기록이 없어요. 시작을 눌러 연습해 보세요.</div>
      <button class="secondary" id="toSummary" hidden>오늘 요약 보기</button>
      <div class="note">이 기록은 이 화면을 열어 둔 동안만 남아요. 닫거나 새로고침하면 사라지니, 남기고 싶다면 요약 화면에서 이미지로 저장해 주세요.</div>
    </section>
  </div>
</div>

<div class="wrap" id="summary" hidden>
  <header><h1>오늘의 연습 요약</h1><span class="date" id="date2"></span></header>
  <section class="card sum">
    <div class="badge" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="big" id="sTotal">0분</div>
    <div class="hint" style="margin:4px 0 0">총 연습 시간</div>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><span>연습한 항목</span></div>
      <div class="stat"><b id="sBpm">-</b><span>사용한 BPM</span></div>
    </div>
    <p class="cheer" id="cheer"></p>
    <ul class="list" id="sList"></ul>
    <button class="go" id="save" style="margin-top:20px;height:64px;font-size:1.25rem">이미지로 저장</button>
    <button class="secondary" id="back">돌아가서 계속 연습하기</button>
    <div class="note" id="saveNote">저장하지 않고 닫으면 오늘의 기록은 사라져요.</div>
  </section>
</div>

<div class="overlay" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h2 id="shT">수고했어요! 기록해 둘까요?</h2>
    <p class="hint" id="shInfo"></p>
    <input class="field" id="name" type="text" maxlength="40" placeholder="곡이나 연습 이름 (비워 둬도 돼요)" aria-label="곡이나 연습 이름">
    <div class="row2"><button class="btn-s" id="shCancel">더 연습할래요</button><button class="btn-p" id="shOk">기록하기</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const human=ms=>{const m=Math.round(ms/60000);if(ms<60000)return Math.max(1,Math.round(ms/1000))+'초';return m+'분'};
let bpm=80,beats=4,running=false,ac=null,nextT=0,beatIdx=0,sched=null,acc=null,raf=0,queue=[],last=0;
let S={ms:0,bpmMs:{}};let records=[];let saved=false;let dl=null;
const today=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
$('#date').textContent=$('#date2').textContent=today;

/* 박자 칩 & 점 */
const beatsEl=$('#beats');
[2,3,4,5,6].forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed',n===beats);b.setAttribute('aria-label',n+'박자');b.onclick=()=>{beats=n;beatIdx%=n;[...beatsEl.querySelectorAll('.chip')].forEach(c=>c.setAttribute('aria-pressed',c===b));drawDots(-1)};beatsEl.appendChild(b)});
function drawDots(on){const d=$('#dots');d.innerHTML='';for(let i=0;i<beats;i++){const e=document.createElement('div');e.className='dot'+(i===0?' first':'')+(i===on?' on':'');d.appendChild(e)}}
drawDots(-1);

/* BPM */
function setBpm(v){v=Math.max(30,Math.min(240,Math.round(+v)||bpm));bpm=v;$('#bpm').value=v;$('#range').value=v}
$('#dec').onclick=()=>setBpm(bpm-1);$('#inc').onclick=()=>setBpm(bpm+1);
$('#range').oninput=e=>setBpm(e.target.value);
$('#bpm').onchange=e=>setBpm(e.target.value);
$('#bpm').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
function hold(btn,d){let t,iv;const stop=()=>{clearTimeout(t);clearInterval(iv)};btn.addEventListener('pointerdown',()=>{t=setTimeout(()=>{iv=setInterval(()=>setBpm(bpm+d),90)},450)});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop))}
hold($('#dec'),-1);hold($('#inc'),1);

/* 오디오 */
function click(t,accent){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=accent?1320:880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(accent?0.9:0.6,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.09)}
function schedule(){while(nextT<ac.currentTime+0.12){click(nextT,beatIdx===0);queue.push({t:nextT,i:beatIdx});nextT+=60/bpm;beatIdx=(beatIdx+1)%beats}}
function frame(){if(!running)return;while(queue.length&&queue[0].t<=ac.currentTime){const q=queue.shift();drawDots(q.i)}raf=requestAnimationFrame(frame)}
function tick(){const n=performance.now();if(running){const dt=n-last;S.ms+=dt;S.bpmMs[bpm]=(S.bpmMs[bpm]||0)+dt}last=n;$('#timer').textContent=fmt(S.ms);$('#finish').disabled=S.ms<1000}
function start(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();running=true;beatIdx=0;queue=[];nextT=ac.currentTime+0.08;schedule();sched=setInterval(schedule,25);last=performance.now();acc=setInterval(tick,200);raf=requestAnimationFrame(frame);$('#go').textContent='멈추기';$('#go').classList.add('run')}
function stop(){tick();running=false;clearInterval(sched);clearInterval(acc);cancelAnimationFrame(raf);queue=[];drawDots(-1);$('#go').textContent=S.ms>0?'이어서 시작':'시작';$('#go').classList.remove('run');tick()}
$('#go').onclick=()=>running?stop():start();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();$('#go').click()}});

/* 기록 */
function sessionBpm(){const ks=Object.keys(S.bpmMs).map(Number);if(!ks.length)return{main:bpm,min:bpm,max:bpm};let main=ks[0];ks.forEach(k=>{if(S.bpmMs[k]>S.bpmMs[main])main=k});return{main,min:Math.min(...ks),max:Math.max(...ks)}}
const bpmText=r=>r.min===r.max?r.main+' BPM':r.min+'–'+r.max+' BPM (주로 '+r.main+')';
$('#finish').onclick=()=>{if(running)stop();if(S.ms<1000)return;const b=sessionBpm();$('#shInfo').textContent=human(S.ms)+' 동안 연습했어요 · '+bpmText(b);$('#name').value='';$('#sheetBg').hidden=false;setTimeout(()=>$('#name').focus(),50)};
$('#shCancel').onclick=()=>{$('#sheetBg').hidden=true};
$('#name').onkeydown=e=>{if(e.key==='Enter')$('#shOk').click()};
$('#shOk').onclick=()=>{const b=sessionBpm();records.push({name:$('#name').value.trim()||'이름 없는 연습',ms:S.ms,...b});S={ms:0,bpmMs:{}};saved=false;$('#sheetBg').hidden=true;tick();$('#go').textContent='시작';render();toast('기록했어요. 오늘도 한 걸음!')};
function li(r,i,del){const e=document.createElement('li');e.className='item';const a=document.createElement('div');a.className='nm';const n=document.createElement('div');n.textContent=r.name;const m=document.createElement('div');m.className='meta';m.textContent=bpmText(r);a.append(n,m);const t=document.createElement('div');t.className='tm';t.textContent=human(r.ms);e.append(a,t);if(del){const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label',r.name+' 기록 지우기');x.onclick=()=>{records.splice(i,1);render()};e.appendChild(x)}return e}
function render(){const l=$('#list');l.innerHTML='';records.forEach((r,i)=>l.appendChild(li(r,i,true)));$('#empty').hidden=records.length>0;$('#toSummary').hidden=!records.length}
function stats(){const tot=records.reduce((a,r)=>a+r.ms,0);const lo=Math.min(...records.map(r=>r.min)),hi=Math.max(...records.map(r=>r.max));return{tot,lo,hi,txt:lo===hi?lo+'':lo+'–'+hi}}
function cheer(ms){const m=ms/60000;return m<5?'시작이 반이에요. 오늘도 악기 앞에 앉은 것만으로 멋져요.':m<20?'차근차근 쌓이고 있어요. 꾸준함이 실력이 돼요.':m<45?'집중해서 잘 해냈어요. 손끝이 한 뼘 더 자랐을 거예요.':'오늘 정말 많이 연습했어요. 충분히 쉬어 주세요.'}
$('#toSummary').onclick=()=>{if(running)stop();const s=stats();$('#sTotal').textContent=human(s.tot);$('#sCount').textContent=records.length+'가지';$('#sBpm').textContent=s.txt;$('#cheer').textContent=cheer(s.tot);const l=$('#sList');l.innerHTML='';records.forEach((r,i)=>l.appendChild(li(r,i,false)));$('#main').hidden=true;$('#summary').hidden=false;window.scrollTo(0,0)};
$('#back').onclick=()=>{$('#summary').hidden=true;$('#main').hidden=false;window.scrollTo(0,0)};

/* 이미지 저장 (사용자가 누를 때만) */
function wrapText(c,t,x,y,w,lh){let line='';for(const ch of t){if(c.measureText(line+ch).width>w){c.fillText(line,x,y);y+=lh;line=ch}else line+=ch}c.fillText(line,x,y);return y+lh}
function makePng(){const s=stats(),shown=records.slice(0,8),H=720+shown.length*96+(records.length>8?60:0);const cv=document.createElement('canvas');cv.width=1080;cv.height=H;const c=cv.getContext('2d');const F='"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
c.fillStyle='#F4F5FA';c.fillRect(0,0,1080,H);c.fillStyle='#FFFFFF';c.beginPath();c.roundRect(60,60,960,H-120,40);c.fill();
c.textAlign='center';c.fillStyle='#FBF0DA';c.beginPath();c.arc(540,190,64,0,7);c.fill();c.strokeStyle='#E8A33D';c.lineWidth=10;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(512,190);c.lineTo(534,212);c.lineTo(572,168);c.stroke();
c.fillStyle='#5A6078';c.font='500 32px '+F;c.fillText('토닥 · '+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}),540,310);
c.fillStyle='#1D2233';c.font='700 110px '+F;c.fillText(human(s.tot),540,430);c.fillStyle='#5A6078';c.font='500 30px '+F;c.fillText('총 연습 시간',540,478);
c.fillStyle='#1D2233';c.font='600 38px '+F;c.fillText('연습한 항목 '+records.length+'가지  ·  '+s.txt+' BPM',540,554);
c.font='500 32px '+F;c.fillStyle='#4B5BD7';c.fillText(cheer(s.tot),540,620,880);
let y=680;c.textAlign='left';shown.forEach(r=>{c.fillStyle='#DDE0EC';c.fillRect(110,y,860,2);c.fillStyle='#1D2233';c.font='600 34px '+F;let nm=r.name;while(c.measureText(nm).width>520&&nm.length>1)nm=nm.slice(0,-1);c.fillText(nm===r.name?nm:nm+'…',110,y+56);c.textAlign='right';c.fillText(human(r.ms),970,y+56);c.fillStyle='#5A6078';c.font='500 26px '+F;c.fillText(bpmText(r),970,y+88);c.textAlign='left';y+=96});
if(records.length>8){c.fillStyle='#5A6078';c.font='500 28px '+F;c.fillText('외 '+(records.length-8)+'가지',110,y+44)}
return new Promise(r=>cv.toBlob(r,'image/png'))}
$('#save').onclick=async()=>{if(!records.length)return;if(!dl){toast('이 화면에서는 바로 저장할 수 없어요. 화면을 캡처해 주세요.');return}
try{const b=await makePng();const d=new Date();await dl.save({filename:'연습요약-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.png',data:b});saved=true;$('#saveNote').textContent='저장했어요. 오늘도 수고 많았어요!'}catch(e){if(e&&e.code!=='declined')toast('저장하지 못했어요. 다시 시도해 주세요.')}};
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{})}catch(e){}

/* 나가기 전 안내 */
window.addEventListener('beforeunload',e=>{if((records.length&&!saved)||S.ms>1000){e.preventDefault();e.returnValue=''}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
render();
})();
</script>
</body>
</html>
